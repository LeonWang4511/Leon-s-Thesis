<style>
/* Custom styles for Leon's Thesis */

/* Wrap tables in scrollable container without breaking internal layout */
.main-content > table,
.main-content > p > table,
.main-content > div > table {
  max-width: 100%;
}

/* Tighter font in tables */
.main-content table th,
.main-content table td {
  font-size: 0.88rem;
  padding: 0.45rem 0.7rem;
}

/* Bold cells get purple accent */
.main-content table td strong {
  color: #5e35b1;
}

/* Inline code in tables smaller */
.main-content table code {
  font-size: 0.82rem;
  padding: 0.05rem 0.3rem;
}

/* H2 separator */
.main-content h2 {
  border-bottom: 1px solid #e1e4e8;
  padding-bottom: 0.4rem;
  margin-top: 2rem;
}

.main-content h2:first-of-type {
  margin-top: 1rem;
}

/* For very wide tables, let user scroll horizontally on the page itself.
   Don't force the table itself to scroll — that breaks just-the-docs layout. */
.main-content table {
  display: table;
  width: 100%;
  table-layout: auto;
}
</style>
